<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University FAQ Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div>
        <h1>University FAQ Assistant</h1>
        <p class="subtitle">Admissions • Fees • Timetable • Exams • Library • Societies • Contact</p>
      </div>
      <div class="header-buttons">
        <button id="themeBtn" title="Toggle dark/light mode">🌙</button>
        <button id="voiceBtn" title="Mute/unmute voice">🔊</button>
      </div>
    </header>

    <!-- Chat Messages Area -->
    <div id="chatArea" class="chat-area">
      <div class="message bot" id="welcomeMsg">
        <div class="bubble">Hello! I'm your university FAQ assistant. Ask me about admissions, fees, timetables, exams, the library, societies, or contact info. Type or click the mic to speak.</div>
      </div>
    </div>

    <!-- Quick Question Buttons -->
    <div id="chips" class="chips"></div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-row">
        <input type="text" id="userInput" placeholder="Type your question..." />
        <button id="sendBtn" title="Send">➤</button>
        <button id="micBtn" title="Voice input">🎤</button>
      </div>
      <button id="clearBtn" class="clear-btn">Clear Chat</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
